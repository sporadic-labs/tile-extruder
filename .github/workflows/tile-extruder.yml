name: Tile Extruder CI

on:
  push:
    branches: ["main"]
  # Run on PRs against any base branch so stacked PRs get CI too.
  pull_request:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm --filter tile-extruder test

  # Runs the node example against the workspace library, so the example (and
  # the API it documents) can't silently drift out of date.
  node-example:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm --filter node-example start
      - run: test -s packages/node-example/images/buch-tileset-extruded.png
